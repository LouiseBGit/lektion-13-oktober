name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./WeatherAPI/WeatherAPI.slnx

      - name: Build
        run: dotnet build ./WeatherAPI/WeatherAPI.slnx --no-restore'

      - name: Run tests
        run: dotnet test ./WeatherAPI/WeatherAPI.slnx --no-build
        