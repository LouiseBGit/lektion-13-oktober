name: Backend CI

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore ./WeatherAPI/WeatherAPI.slnx

            - name: Build
              run: dotnet build ./WeatherAPI/WeatherAPI.slnx --no-restore

            - name: Run tests
              run: dotnet test ./WeatherAPI/WeatherAPI.slnx --no-build

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}
            - name: Build Docker image
              working-directory: ./WeatherAPI/WeatherAPI
              run: docker build -t ${{ secrets.DOCKER_USERNAME }}/weatherapi:${{ github.sha }} .
            - name: Push Docker image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/weatherapi:${{ github.sha }}
            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                  app-name: sut25-LB-2026-10-13
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLIC }}
                  images: ${{ secrets.DOCKER_USERNAME }}/weatherapi:${{ github.sha }}
