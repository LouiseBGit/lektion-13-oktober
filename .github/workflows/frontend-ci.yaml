name: Frontend CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./weather-frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm install

            - name: Run lint
              run: npm run lint

            - name: Build project
              run: npm run build
